name: Publish

on:
  release:
    types: [published]

permissions:
  id-token: write  # required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    name: Publish to CodeArtifact
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get auth token
        run: |
          echo "ARTIFACTORY_PASSWORD=$(aws codeartifact get-authorization-token \
            --domain root \
            --domain-owner ${{ secrets.AWS_ACCOUNT_ID }} \
            --region ${{ secrets.AWS_REGION }} \
            --query authorizationToken --output text)" >> "$GITHUB_ENV"

      - name: Publish
        env:
          ARTIFACTORY_URL: https://root-${{ secrets.AWS_ACCOUNT_ID }}.d.codeartifact.${{ secrets.AWS_REGION }}.amazonaws.com/maven/gradle-plugins/
          ARTIFACTORY_USER: aws
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          ./gradlew publish -PpluginVersion="${VERSION#v}"
